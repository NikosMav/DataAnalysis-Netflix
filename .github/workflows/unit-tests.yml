name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lightweight test stack
        # Dense and cross-encoder models are mocked or lazily loaded in unit tests.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.23,<3" \
            "pandas>=1.5,<3" \
            "scikit-learn>=1.2,<2" \
            "rank-bm25>=0.2.2,<1" \
            "pytest>=7.0,<9"
          pip install -e . --no-deps

      - name: Run unit tests
        # Unit tests only — do NOT run `python -m retrieval eval` (model download).
        run: pytest tests/ -q

      - name: Verify committed metrics documentation
        run: |
          python scripts/sync_metrics_docs.py
          git diff --exit-code README.md RETRIEVAL.md
